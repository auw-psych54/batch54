<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUW Psychology Students · Batch 54</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1b47">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batch 54">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Direction: "the lighthouse" from the AUW emblem. Night-navy header with one slow sweeping lamp beam; lamp-gold is the single accent.
   Layout: hero → deadlines → course folders; course = tab strip (Lectures / Definitions / Terms / Questions); lecture = stack of slide frames with Arabic notes. */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --ink:#131b33; --muted:#5b6582; --line:#dde1ec;
  --navy:#1b2f73; --night:#0f1b47; --on-navy:#ffffff; --lamp:#f2b632; --lamp-ink:#3a2a00;
  --accent:#1b2f73; --accent-soft:#eaeef8; --note:#fbf6e7;
  --ok:#1d7a4f; --ok-soft:#e2f2e9; --warn:#a8650a; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe6e4;
  --display:"Fraunces",Georgia,serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --ar:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#151c33; --ink:#e8ebf4; --muted:#9aa4c0; --line:#28314d;
  --navy:#16245c; --night:#0a1235; --accent:#a9bdf2; --accent-soft:#1c2647; --note:#2a2414;
  --ok:#5cc792; --ok-soft:#14302a; --warn:#e8a849; --warn-soft:#33270f; --bad:#f08178; --bad-soft:#3a1c1a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#151c33; --ink:#e8ebf4; --muted:#9aa4c0; --line:#28314d;
  --navy:#16245c; --night:#0a1235; --accent:#a9bdf2; --accent-soft:#1c2647; --note:#2a2414;
  --ok:#5cc792; --ok-soft:#14302a; --warn:#e8a849; --warn-soft:#33270f; --bad:#f08178; --bad-soft:#3a1c1a;
  color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
[lang="ar"]{font-family:var(--ar);line-height:1.9}
[dir="rtl"]{text-align:right}
[lang="ar"] h2,[lang="ar"] h3{font-family:var(--ar);font-weight:700}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2;font-weight:600}
h2{font-size:1.45rem;letter-spacing:-.01em} h3{font-size:1.08rem}
.muted{color:var(--muted);font-size:.9rem;margin:0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%, var(--navy) 0%, var(--night) 70%);color:var(--on-navy)}
.beam{position:absolute;left:24px;top:24px;width:1600px;height:1600px;margin:-800px 0 0 -800px;pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(242,182,50,.0) 60deg, rgba(242,182,50,.32) 78deg, rgba(255,226,140,.5) 82deg, rgba(242,182,50,.32) 86deg, rgba(242,182,50,0) 104deg, transparent 360deg);
  transform:rotate(-30deg);opacity:.7}
@media (prefers-reduced-motion:no-preference){.beam{animation:sweep 16s ease-in-out infinite alternate}}
@keyframes sweep{from{transform:rotate(-40deg)}to{transform:rotate(25deg)}}
.hero .in{position:relative;max-width:900px;margin:0 auto;padding:22px 16px 0;display:grid;gap:14px}
.brand{display:flex;gap:16px;align-items:center}
.logo{width:72px;height:72px;border-radius:50%;background:#fff;padding:3px;flex:none;box-shadow:0 0 0 3px rgba(242,182,50,.55),0 0 30px rgba(242,182,50,.35)}
.hero h1{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:800;letter-spacing:-.02em;line-height:1.08}
.hero h1 em{font-style:italic;font-weight:400;color:var(--lamp)}
.hero .credit{margin:2px 0 0;font-size:.85rem;opacity:.85;text-align:left}
.hero .sub{margin:4px 0 0;font-size:.88rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
#crumbs{display:flex;gap:8px;align-items:center;font-size:.88rem;padding:6px 0 14px;flex-wrap:wrap}
#crumbs a{color:var(--on-navy);opacity:.8;text-decoration:none}
#crumbs a:hover{opacity:1;text-decoration:underline}
#crumbs span{opacity:.5}

.wrap{max-width:900px;margin:0 auto;padding:24px 16px 90px;display:grid;gap:26px}
section{display:grid;gap:12px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* stats + continue */
.stats{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:110px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.cont{display:flex;align-items:center;gap:12px;background:var(--lamp);color:var(--lamp-ink);border-radius:12px;padding:12px 18px;text-decoration:none;font-weight:600;flex:1;min-width:220px}
.cont small{display:block;font-weight:500;opacity:.8}
.cont .arr{margin-left:auto;font-size:1.3rem}

/* alerts */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:10px 14px}
.alert.soon{border-left-color:var(--bad)} .alert.near{border-left-color:var(--warn)}
.alert .info{flex:1;min-width:0} .alert .info b{display:block} .alert .info small{color:var(--muted)}
.days{text-align:center;min-width:56px;font-variant-numeric:tabular-nums}
.days strong{display:block;font-family:var(--display);font-size:1.5rem;line-height:1}
.days span{font-size:.75rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:.92rem}
.pill{font-size:.72rem;padding:1px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;white-space:nowrap;font-weight:600}
.pill.exam{background:var(--bad-soft);color:var(--bad)} .pill.submit{background:var(--warn-soft);color:var(--warn)}

/* folders */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding-top:14px}
.folder{position:relative;display:grid;gap:8px;background:var(--navy);color:var(--on-navy);border-radius:0 14px 14px 14px;padding:20px 20px 18px;text-decoration:none;transition:transform .2s}
.folder::before{content:"";position:absolute;left:0;top:-14px;width:44%;height:16px;background:var(--navy);border-radius:10px 14px 0 0}
.folder::after{content:"";position:absolute;inset:auto 18px -6px 18px;height:6px;background:var(--lamp);border-radius:0 0 8px 8px;opacity:.9}
.folder:hover{transform:translateY(-3px)}
.folder .lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.folder b{font-family:var(--display);font-size:1.3rem;line-height:1.2;font-weight:600}
.folder small{opacity:.8}
.folder .fbar{height:5px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.folder .fbar i{display:block;height:100%;background:var(--lamp)}

/* course tabs */
.chead{display:grid;gap:2px}
.chead h2{font-size:clamp(1.5rem,5vw,2rem)}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ctabs a{text-decoration:none;color:var(--muted);padding:9px 14px;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.ctabs a:hover{color:var(--ink)}
.ctabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--lamp)}
.ctabs a .c{font-size:.72rem;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 7px;margin-left:5px}

/* lecture list */
.progress{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.list{display:grid;gap:10px}
.lec{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .2s}
.lec:hover{border-color:var(--navy)}
.num{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;color:var(--navy);min-width:44px;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .num{color:var(--lamp)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .num{color:var(--lamp)}}
.lec .t{flex:1;min-width:0;font-weight:600;line-height:1.35} .lec .t small{display:block;color:var(--muted);font-weight:400;margin-top:3px}
.marks{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mk{font-size:.7rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.mk.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* lecture reader */
.lhead{display:grid;gap:6px}
.lhead h2{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:800;letter-spacing:-.015em}
.back{justify-self:start;color:var(--accent);text-decoration:none;font-weight:600;font-size:.92rem}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.slide .sn{display:flex;justify-content:space-between;background:var(--navy);color:var(--on-navy);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 16px;font-variant-numeric:tabular-nums}
.slide .sn span{opacity:.7}
.slide .en{padding:16px 20px;line-height:1.7}
.slide .en h3{font-size:1.25rem;margin-bottom:8px}
.slide .en p{margin:0 0 8px}
.slide .en ul{margin:0 0 6px;padding-left:1.2em}
.slide .en li::marker{color:var(--lamp)}
.slide .ar{background:var(--note);border-top:1px dashed var(--line);border-right:4px solid var(--lamp);padding:12px 20px}
.slide .ar b.lbl{font-size:.78rem;color:var(--muted);display:block;font-weight:600}
.slide .ar p{margin:0 0 6px}
.cd{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--on-navy);background:var(--navy);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-family:var(--ar)}
.cd.soon{background:var(--bad)}
.cd-n{font-family:var(--display);font-size:2rem;font-weight:800;color:var(--lamp);min-width:2.2ch;text-align:center}
.cd.soon .cd-n{color:#fff}
.cd > span > b{display:block}.cd small{opacity:.85}
.inst{position:relative;background:var(--note);border:1px solid var(--line);border-right:4px solid var(--lamp);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-family:var(--ar);line-height:1.7}
.inst p{margin:4px 0}.inst .btn{margin:6px 0}
.inst-x{position:absolute;left:8px;top:6px;background:none;border:0;color:var(--muted);font-size:1rem;cursor:pointer}
.mi .eyebrow{display:block;margin-bottom:4px}
.rv{margin-top:22px}.rv h2{font-size:1.2rem}.rv .recap{margin-top:8px}
.slide .tip{background:var(--accent-soft);border-top:1px solid var(--line);border-right:4px solid var(--accent);padding:12px 20px;font-family:var(--ar);line-height:1.8}
.recap{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lamp);border-radius:14px;padding:16px 20px;margin-top:18px;font-family:var(--ar);line-height:1.8}
.recap h2{margin:0 0 10px}.recap h4{margin:14px 0 6px;font-size:1rem}
.recap .tw{overflow-x:auto}.recap table{width:100%;border-collapse:collapse;font-size:.92rem}
.recap th,.recap td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.recap thead th{background:var(--navy);color:var(--on-navy)}.recap tbody th{background:var(--accent-soft)}
.recap .rc-m p{background:var(--note);border-radius:10px;padding:8px 12px;margin:0 0 8px}
.recap ol{margin:0;padding-right:1.3em}
.recap .ltr-list{padding-left:1.4em;padding-right:0;text-align:left;font-family:var(--body)}
.ltr{display:block;text-align:left;margin:4px 0}

.term{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--lamp);text-decoration-thickness:2px;text-underline-offset:3px}
.term:hover{background:var(--note)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;cursor:pointer;border:2px solid var(--navy);background:var(--surface);color:var(--ink);padding:9px 18px;border-radius:10px}
.btn.on{background:var(--ok);border-color:var(--ok);color:#fff}

/* questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.q p{margin:0;font-weight:600}
.opts{display:grid;gap:6px}
.opt{font:inherit;text-align:left;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.opt:hover{border-color:var(--navy)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.reveal{font:inherit;font-weight:600;justify-self:start;cursor:pointer;background:none;border:none;color:var(--accent);padding:0;text-decoration:underline;text-decoration-color:var(--lamp)}
.ans{background:var(--ok-soft);border-radius:9px;padding:10px 12px;font-size:.95rem}

/* definitions — index cards */
.def{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:grid;gap:8px;background-image:linear-gradient(var(--surface) 34px, var(--lamp) 34px, var(--lamp) 36px, var(--surface) 36px)}
.def .dt{font-family:var(--display);font-weight:600;font-size:1.1rem;display:flex;gap:8px;align-items:center;height:20px}
.def .den{margin:6px 0 0}
.def .dar{margin:0;background:var(--note);border-radius:8px;padding:6px 12px}
.group{gap:10px}
.group h3{color:var(--muted);font-family:var(--body);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}

/* glossary */
.search{font:inherit;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:3px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .2s}
.gi:hover{border-color:var(--lamp)}
.gi .w{font-family:var(--display);font-weight:600;font-size:1.05rem}
.gi small{color:var(--muted)}
.say{font:inherit;cursor:pointer;border:none;background:var(--lamp);color:var(--lamp-ink);border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:600;line-height:1.7}

/* exam */
.xstart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.xstart p{margin:0}
.btn.go{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.xbar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;background:var(--bg);padding:10px 0;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.xmeta{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.opt.sel{background:var(--accent-soft);border-color:var(--navy);font-weight:600}
.opt:disabled{cursor:default;color:var(--ink)}
.xq.ok{border-left:5px solid var(--ok)} .xq.no{border-left:5px solid var(--bad)}
.score{display:flex;gap:18px;align-items:center;background:var(--night);color:var(--on-navy);border-radius:14px;padding:18px 20px;border-top:4px solid var(--lamp)}
.score .pct{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--lamp);font-variant-numeric:tabular-nums}
.score .pct span{font-size:1.4rem}
.score p{margin:2px 0 8px;opacity:.85}
.bylec{display:flex;flex-wrap:wrap;gap:6px}
.bylec span{font-size:.78rem;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.12)}
.bylec span.weak{background:var(--bad);color:#fff}
/* timetable, streak, qotd, flashcards */
.now{display:flex;gap:12px;align-items:center;background:var(--night);color:var(--on-navy);border-radius:12px;padding:12px 16px;border-left:5px solid var(--lamp)}
.now b{display:block;font-family:var(--display);font-size:1.15rem}
.now span{opacity:.85;font-size:.9rem}
.now.live{border-left-color:var(--ok)}
.now .dot{width:12px;height:12px;border-radius:50%;background:#5cc792;flex:none;box-shadow:0 0 0 4px rgba(92,199,146,.25)}
@media (prefers-reduced-motion:no-preference){.now .dot{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(92,199,146,0)}}
.tt{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.slot .sd{font-family:var(--display);font-weight:800;color:var(--navy);font-size:1.05rem}
.slot .sc{font-weight:600;line-height:1.3}
.slot .st{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.slot.today{border-color:var(--lamp);background:var(--note)}
.slot.live{border-color:var(--ok);background:var(--ok-soft)}
.stat.streak b{color:var(--warn)}
.qotd{border-top:4px solid var(--lamp)}
.fb{display:block;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--accent);text-decoration:none;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;justify-self:start}
.seg a{padding:7px 16px;text-decoration:none;color:var(--muted);font-weight:600}
.seg a[aria-current="page"]{background:var(--navy);color:var(--on-navy)}
.fctop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.sel{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.fc{font:inherit;color:inherit;cursor:pointer;width:100%;min-height:260px;display:grid;align-content:center;justify-items:center;gap:12px;text-align:center;padding:28px 22px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:0 10px 30px rgba(15,27,71,.10);background-image:linear-gradient(var(--surface) 46px, var(--lamp) 46px, var(--lamp) 48px, var(--surface) 48px)}
.fc.flipped{background:var(--night);color:var(--on-navy);background-image:none;border-color:var(--night)}
.fcl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:-8px}
.fcbig{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.1}
.fct{font-family:var(--display);font-weight:600;color:var(--lamp);font-size:1.2rem}
.fcen{line-height:1.6}
.fcar{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;width:100%}
.fca{justify-content:center}
.fcdone{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:10px;justify-items:start}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff;text-decoration:none}
.walink{color:var(--accent);font-weight:600}
.join{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--lamp);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.join p{margin:0}
.namebox{display:grid;gap:6px}
.namebox label{font-size:.85rem;color:var(--muted)}
.nrow{display:flex;gap:8px}
.nrow input{flex:1;min-width:0}
.nerr{margin:0;color:var(--bad);font-size:.85rem}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.lb li:nth-child(1) .rk{background:var(--lamp);color:var(--lamp-ink)}

 {en:["Management in mental health settings","In mental health settings, management focuses on the day-to-day operation of the facility, including supervising staff, managing budgets, coordinating patient care, ensuring compliance with regulations, and evaluating the quality and effectiveness of services.","The main functions of management include:","- Planning","- Organizing","- Staffing","- Directing","- Controlling","- Communication","- Decision-Making"],
  ar:["في الصحة النفسية، الإدارة التنفيذية مسؤولة عن الشغل اليومي: الإشراف على الموظفين، الميزانية، تنسيق رعاية المرضى، الالتزام باللوائح، وتقييم جودة الخدمات.","وظائفها السبعة: التخطيط، التنظيم، التوظيف، التوجيه، الرقابة، التواصل، واتخاذ القرار. <b>احفظيها بالترتيب.</b>"]},
 {en:["A. Planning","A plan is a predetermined course of action which provides purpose and direction of an organization.","- Planning is foreseeing future circumstances and requirements, then setting objectives, making long and short term plans and determining the policies to be followed with standards to be set.","- In planning, managers receive and store information, monitor and disseminate the information. A manager makes decisions on strategy and allocation of resources and initiates planned changes."],
  ar:["الخطة هي طريق عمل محدد مسبقاً بيدي المؤسسة هدف واتجاه.","التخطيط (Planning) يعني تتوقعي الظروف والاحتياجات الجاية، وبعدها تحددي الأهداف، وتعملي خطط طويلة وقصيرة المدى، وتحددي السياسات والمعايير.","المدير في التخطيط بيجمع المعلومات ويتابعها وينشرها، وبيقرر الاستراتيجية وكيف يوزع الموارد."]},
 {en:["B. Organizing","- This is the identification and classification of the required activities, the grouping of activities necessary to attain objectives, the assignment of each grouping to a manager with authority and the provision of coordination.","- In organizing, structures are created, relationships established and resources are allocated for the accomplishment of activities.","- In organizing, plans are reviewed, tasks to be performed are listed, tasks are grouped into jobs that can be done by an individual, departments are created, work is assigned to individuals and authority is delegated."],
  ar:["التنظيم (Organizing) يعني تحددي الأنشطة المطلوبة، وتجمعيها في مجموعات، وكل مجموعة تديها لمدير عنده صلاحية، مع التنسيق بيناتهم.","فيه بنعمل الهيكل التنظيمي، ونحدد العلاقات، ونوزع الموارد.","الخطوات: مراجعة الخطط ← كتابة المهام ← تجميعها في وظائف ← إنشاء الأقسام ← توزيع الشغل ← تفويض السلطة."]},
 {en:["C. Staffing","- Staffing involves manning the organizational structure through proper and effective appraisal, selection and development of people to fill the roles designed into the structure.","- Staffing is also known as Human Resource Management. It is the management function concerned with acquiring, training, appraising, and compensating employees.","Staffing process involves:","- 1. Development of organizational structure","- 2. Assessment of manpower required and available","- 3. Assessment of their quality, qualification and skills for the job","- 4. Appraisal (evaluation): strengths and shortcomings","- 5. Conduct development programs"],
  ar:["التوظيف (Staffing) يعني تملي الوظائف في الهيكل التنظيمي بالناس المناسبين، عن طريق التقييم والاختيار والتطوير.","اسمه التاني <b>إدارة الموارد البشرية</b>: تعيين الموظفين وتدريبهم وتقييمهم ودفع أجورهم.","خطواته خمسة: الهيكل التنظيمي، تقدير عدد الموظفين المطلوب والموجود، تقييم مؤهلاتهم ومهاراتهم، تقييم نقاط قوتهم وضعفهم، وبرامج التطوير."]},
 {en:["D. Directing / Leading","Leading is the process of influencing people so that they will contribute to organization and group goals.","- Directing involves the initiation of action and it entails three elements that are action oriented in nature.","These are:","- motivation","- communication","- leadership"],
  ar:["التوجيه أو القيادة (Leading): التأثير في الناس عشان يساهموا في أهداف المؤسسة والمجموعة.","التوجيه هو البداية الفعلية للعمل، وعنده <b>3 عناصر</b>: التحفيز، والتواصل، والقيادة."]},
 {en:["E. Controlling","This is the measurement and correction of performance in order to ensure that enterprise objectives and plans devised to attain them are accomplished.","- Controlling is a function of every manager both at lower and upper level since all have responsibility for the execution of plans.","In controlling we must:","- Establish standards","- Measure performance","- Correct deviations"],
  ar:["الرقابة (Controlling): قياس الأداء وتصحيحه عشان نتأكد إنو الأهداف والخطط اتحققت.","دي مسؤولية كل مدير، في المستويات العليا والدنيا، لأنهم كلهم مسؤولين عن تنفيذ الخطط.","خطواتها <b>3</b>: نضع المعايير ← نقيس الأداء ← نصحح الانحرافات."]},
 {en:["F. Communication","The continuous exchange of information, instructions, ideas, and feedback between managers, staff, and other healthcare professionals to ensure coordination and effective teamwork.","G. Decision-Making","The continuous process of identifying problems, considering alternatives, and selecting the most appropriate course of action to achieve organizational objectives."],
  ar:["التواصل (Communication): تبادل مستمر للمعلومات والتعليمات والأفكار والملاحظات بين المديرين والموظفين والكوادر الصحية، عشان يحصل تنسيق وشغل جماعي فعّال.","اتخاذ القرار (Decision-Making): عملية مستمرة: نحدد المشكلة ← ندرس البدائل ← نختار الأنسب عشان نحقق الأهداف."]}
 ],
 defs:[
  {t:"Administration", en:"A determinative function that focuses on establishing the general purpose, policies, major objectives, and overall direction of an organization.", ar:"وظيفة بتحدد الهدف العام والسياسات والأهداف الكبيرة والاتجاه العام للمؤسسة."},
  {t:"Management", en:"An executive function concerned with the active direction, coordination, and utilization of human efforts and organizational resources to achieve established objectives.", ar:"وظيفة تنفيذية بتوجّه وتنسق جهود الناس وموارد المؤسسة عشان تحقق الأهداف."},
  {t:"Plan", en:"A predetermined course of action which provides purpose and direction of an organization.", ar:"طريق عمل محدد مسبقاً بيدي المؤسسة هدف واتجاه."},
  {t:"Planning", en:"Foreseeing future circumstances and requirements, then setting objectives, making long and short term plans and determining the policies to be followed with standards to be set.", ar:"توقع الظروف الجاية، وتحديد الأهداف، ووضع خطط طويلة وقصيرة المدى، وتحديد السياسات والمعايير."},
  {t:"Organizing", en:"The identification and classification of the required activities, the grouping of activities necessary to attain objectives, the assignment of each grouping to a manager with authority and the provision of coordination.", ar:"تحديد الأنشطة وتصنيفها وتجميعها، وإسناد كل مجموعة لمدير عنده صلاحية، مع التنسيق."},
  {t:"Staffing", en:"Manning the organizational structure through proper and effective appraisal, selection and development of people to fill the roles designed into the structure.", ar:"ملء الهيكل التنظيمي بالناس المناسبين عن طريق التقييم والاختيار والتطوير."},
  {t:"Leading", en:"The process of influencing people so that they will contribute to organization and group goals.", ar:"التأثير في الناس عشان يساهموا في أهداف المؤسسة والمجموعة."},
  {t:"Controlling", en:"The measurement and correction of performance in order to ensure that enterprise objectives and plans devised to attain them are accomplished.", ar:"قياس الأداء وتصحيحه عشان نضمن تحقيق الأهداف والخطط."},
  {t:"Communication", en:"The continuous exchange of information, instructions, ideas, and feedback between managers, staff, and other healthcare professionals to ensure coordination and effective teamwork.", ar:"تبادل مستمر للمعلومات والتعليمات والأفكار بين المديرين والموظفين والكوادر الصحية."},
  {t:"Decision-Making", en:"The continuous process of identifying problems, considering alternatives, and selecting the most appropriate course of action to achieve organizational objectives.", ar:"تحديد المشكلة ودراسة البدائل واختيار أنسب حل لتحقيق الأهداف."}
 ],
 questions:[
  {q:"Which one is a determinative function?", opts:["Management","Administration","Staffing","Controlling"], a:1},
  {q:"Management is considered:", opts:["A science only","An art only","A science, an art, and a profession","A policy"], a:2},
  {q:"\"Establish standards, measure performance, correct deviations\" are steps of:", opts:["Planning","Organizing","Controlling","Staffing"], a:2},
  {q:"Staffing is also known as:", opts:["Decision-Making","Human Resource Management","Leadership","Administration"], a:1},
  {q:"The three elements of Directing are:", opts:["Planning, organizing, staffing","Motivation, communication, leadership","Standards, performance, deviations","Policy, procedure, purpose"], a:1},
  {q:"List three differences between Administration and Management.", ans:"1) Administration is a determinative function; Management is an executive function. 2) Administration decides what the organization aims to achieve (purpose, policies, major objectives); Management directs and coordinates people and resources to achieve them. 3) Administration sets the framework; Management runs day-to-day operations within it."}
 ]},
{ title:"سياسة الصحة النفسية في السودان", en:"Mental Health Policy in Sudan", slides:[
 {en:["Mental health policy in Sudan","Sudan's mental health policy, which was last published in 2008, proposes the following components: developing a mental health component in primary healthcare, scaling up human resources, involvement of patients and their families, strengthening advocacy, promotion of the human rights protection of patients, equity and access to mental healthcare services across different groups, quality improvement, financing and monitoring systems."],
  ar:["آخر سياسة صحة نفسية في السودان اتنشرت سنة <b>2008</b>.","مكوناتها: إدخال الصحة النفسية في الرعاية الصحية الأولية، زيادة الكوادر، إشراك المرضى وأسرهم، تقوية المناصرة، حماية حقوق المرضى، العدالة في الوصول للخدمات لكل الفئات، تحسين الجودة، والتمويل وأنظمة المتابعة."]},
 {en:["Legislation and the Mental Health Act","A Mental Health Act was drafted in 1998, Parliament approved it only in June 2018.","The Act features the following components:","- access to mental healthcare, including access to the least restrictive care;","- the rights of mental health service patients, their families and other caregivers;","- competency, capacity and guardianship issues for people with mental illness;","- voluntary and involuntary treatment;","- appeal and review systems;","- law enforcement and other judicial system issues for people with mental illness."],
  ar:["قانون الصحة النفسية اتصاغ سنة <b>1998</b>، لكن البرلمان أجازه بعد 20 سنة، في <b>يونيو 2018</b>.","القانون بيغطي: الوصول للعلاج بأقل تقييد ممكن، حقوق المرضى وأسرهم ومقدمي الرعاية، الأهلية والوصاية، العلاج الطوعي والإجباري، أنظمة الاستئناف والمراجعة، وتعامل الشرطة والقضاء مع المرضى النفسيين."]},
 {en:["Mental health service provision","Access to mental health facilities is unevenly distributed across the country, being more available to those living in or near the capital city and, as emphasised, there are severe shortages of trained personnel. Many communities throughout Sudan use traditional and religious healers to help meet their primary healthcare needs."],
  ar:["الخدمات النفسية ما موزعة بعدالة: متوفرة أكتر للساكنين في العاصمة أو قريب منها، وفي نقص شديد في الكوادر المدربة.","عشان كده مجتمعات كتيرة في السودان بتمشي للمعالجين الشعبيين والدينيين."]},
 {en:["Traditional healers","Besides being accessible and available, traditional healers are often part of the wider cultural belief system and are considered integral to everyday life and well-being. Attempts have been made to promote a dialogue between mental health professionals and traditional healers.","As a consequence, there are many traditional healing centres that embrace integral working models of modern psychiatry and receive regular input from medical assistants, who have participated in special training in modern psychiatry, to provide diagnoses and intervention."],
  ar:["المعالجون الشعبيون قريبين ومتاحين، وكمان جزء من ثقافة الناس ومعتقداتهم وحياتهم اليومية.","في محاولات لفتح حوار بينهم وبين مختصي الصحة النفسية. والنتيجة إنو في مراكز علاج شعبي بقت تشتغل مع الطب النفسي الحديث، وبيزورها مساعدين طبيين مدربين في الطب النفسي عشان يشخصوا ويتدخلوا."]},
 {en:["Health system functions: Governance","The health system in Sudan follows a decentralized system, in which responsibilities are distributed among three administrative levels:","A. Federal Level: Federal Ministry of Health (FMOH)","The Federal Ministry of Health is responsible for:","- Policy-making","- Strategic planning","- Managing international relations","- Providing financial and technical support to state ministries of health","- Monitoring and evaluating the overall health status of the country"],
  ar:["النظام الصحي في السودان <b>لا مركزي</b>، والمسؤوليات موزعة على <b>3 مستويات</b>.","المستوى الاتحادي (وزارة الصحة الاتحادية): وضع السياسات، التخطيط الاستراتيجي، العلاقات الدولية، دعم وزارات الولايات مالياً وفنياً، ومتابعة الوضع الصحي للبلد كلها."]},
 {en:["B. State Level: State Ministries of Health","The State Ministries of Health are responsible for:","- Planning health services at the state level","- Providing secondary and tertiary healthcare services","- Providing financial and technical support to localities"],
  ar:["مستوى الولاية (وزارات الصحة الولائية): تخطيط الخدمات في الولاية، وتقديم الرعاية الثانوية والتخصصية، يعني المستشفيات، ودعم المحليات مالياً وفنياً."]},
 {en:["C. Local Level: Localities","Localities are responsible for:","- Providing and managing Primary Health Care (PHC) services: ensuring that people have access to basic healthcare services in their local communities.","- Providing environmental health services: the locality organizes waste collection and monitors drinking water to prevent diseases such as cholera.","- Providing community health services: e.g. organizing a health awareness campaign to educate people about malaria prevention."],
  ar:["المستوى المحلي (المحليات):","• الرعاية الصحية الأولية: إنو الناس يلقوا الخدمات الأساسية في مناطقهم.","• صحة البيئة: جمع النفايات ومراقبة مياه الشرب عشان نمنع أمراض زي الكوليرا.","• صحة المجتمع: مثلاً حملة توعية عن الوقاية من الملاريا."]}
 ],
 defs:[
  {t:"Decentralized health system", en:"A system in which responsibilities are distributed among three administrative levels: federal, state, and local.", ar:"نظام بتتوزع فيه المسؤوليات على 3 مستويات: اتحادي وولائي ومحلي."},
  {t:"Mental Health Act (Sudan)", en:"Drafted in 1998 and approved by Parliament in June 2018.", ar:"اتصاغ 1998 وأجازه البرلمان في يونيو 2018."},
  {t:"Mental Health Policy (Sudan)", en:"Last published in 2008.", ar:"آخر نسخة اتنشرت سنة 2008."},
  {t:"Primary Health Care (PHC)", en:"Ensuring that people have access to basic healthcare services in their local communities.", ar:"إنو الناس يلقوا الخدمات الصحية الأساسية في مجتمعاتهم المحلية."}
 ],
 questions:[
  {q:"Sudan's mental health policy was last published in:", opts:["1998","2008","2018","2020"], a:1},
  {q:"The Mental Health Act was approved by Parliament in:", opts:["1998","2008","June 2018","2010"], a:2},
  {q:"Which level provides secondary and tertiary healthcare services?", opts:["Federal level","State level","Local level","Traditional healers"], a:1},
  {q:"Waste collection and monitoring drinking water is a responsibility of:", opts:["FMOH","State Ministries","Localities","Parliament"], a:2},
  {q:"Strategic planning and managing international relations belong to:", opts:["Federal Ministry of Health","State Ministries of Health","Localities","Clinic managers"], a:0},
  {q:"Why do many communities in Sudan use traditional healers?", ans:"Mental health facilities are unevenly distributed (mostly in or near the capital) and there are severe shortages of trained personnel. Traditional healers are accessible and available, and they are part of the wider cultural belief system and everyday life."}
 ]},
{ title:"تنظيم أنشطة الفريق الصحي: السياسات والإجراءات", en:"Organizing Health Team Activities: Policies and Procedures", slides:[
 {en:["Policies and procedures","Policies and procedures play a vital role in any workplace.","Policy in healthcare is critical as it sets a general plan of action used to guide desired outcomes and is a fundamental guideline to help make decisions. The purpose of healthcare policy and procedures is to communicate to employees the organization's desired outcomes."],
  ar:["السياسات والإجراءات مهمة جداً في أي مكان شغل.","السياسة في الرعاية الصحية هي خطة عمل عامة بتوجّه النتائج المطلوبة، ومرجع أساسي لاتخاذ القرار. والهدف منها إنو الموظفين يعرفوا المؤسسة عايزة توصل لشنو."]},
 {en:["Policies vs. Procedures","Policies provide clear guidelines on how things should be done. They ensure that everyone understands the rules and expectations.","Procedures outline step-by-step processes for specific tasks. They promote consistency in how work is performed."],
  ar:["الفرق المهم:","• <b>السياسة (Policy)</b>: إرشادات واضحة عن كيف المفروض الحاجات تمشي، عشان الكل يفهم القواعد والمتوقع منه.","• <b>الإجراء (Procedure)</b>: خطوات بالترتيب لمهمة محددة، عشان الشغل يتعمل بنفس الطريقة كل مرة."]},
 {en:["Why are policies and procedures important in the workplace?","Policies are important in a workplace as it helps reinforce and clarify the standards expected of employees and help employers manage staff more effectively as it defines what is acceptable and unacceptable in the workplace."],
  ar:["أهميتها: بتوضح المعايير المطلوبة من الموظفين، وبتساعد الإدارة تدير الموظفين بشكل أحسن، لأنها بتحدد شنو المقبول وشنو الما مقبول في الشغل."]},
 {en:["The Clinic Office Manager's duties","The Clinic Office Manager job is an administrative support position and does not include any counseling or supervision duties.","- Answer incoming phone calls, receive and record incoming messages for faculty and student counselors, schedule client appointments with student counselors, and open and close clinic according to scheduled appointments.","- Provide clients with reminder cards for scheduled appointments.","- Maintain files and ensure confidentiality of client records.","- Maintain the schedule of emergency on-call.","- Handle incoming and outgoing mail for the clinic.","- Follow screening/intake policy and procedure guidelines when receiving calls from new or potential clients.","- The Clinic Office Manager will read, understand, and strictly adhere to the American Counseling Association Code of Ethics."],
  ar:["مدير مكتب العيادة وظيفته <b>دعم إداري بس</b>، ما فيها إرشاد ولا إشراف.","مهامه: يرد على التلفونات ويسجل الرسائل، يحدد مواعيد العملاء، يفتح ويقفل العيادة حسب المواعيد، يدي العملاء كروت تذكير، يحفظ الملفات بسرية، ينظم جدول المناوبات الطارئة، يتعامل مع البريد، يتبع إجراءات الفرز والاستقبال للعملاء الجدد، ويلتزم بميثاق أخلاقيات جمعية الإرشاد الأمريكية (ACA)."]},
 {en:["Clinic and client management limits","- Do not give out or volunteer ANY information about counselors or other clients. If the client has a question, tell them the counselor will be happy to call them back.","- The Clinic Office Manager does NOT counsel clients calling in, and is not included in any Request for Information about clients or counseling services.","- The Clinic Office Manager does NOT assign clients to counselors.","- The Clinic Office Manager does NOT handle any client issues over the phone or in person. If there is an incident with a client or outside agency, the only persons authorized to deal with the incident are the counselor of record and that person's direct supervisor. They will determine who else should be involved.","- Does NOT act as a counselor or supervisor and does NOT view counseling sessions in progress.","- Does NOT review tapes, records, or files.","- Does NOT discuss clients or client sessions with trainee counselors or other clients."],
  ar:["الحاجات <b>الممنوعة</b> على مدير المكتب:","• ما يدي أي معلومة عن المرشدين أو العملاء. لو العميل عنده سؤال، يقول ليه المرشد بيتصل عليك.","• ما يرشد العملاء، وما يوزعهم على المرشدين.","• ما يتعامل مع مشاكل العملاء. أي حادثة بيتعامل معاها المرشد المسؤول ومشرفه المباشر بس.","• ما يحضر الجلسات، وما يراجع التسجيلات أو الملفات، وما يتكلم عن العملاء مع أي زول."]},
 {en:["Hours of work","Policy: The clinic will have established hours of operation.","Purpose: To ensure that the general public, clients, and other professionals and agencies are able to access the clinic services.","Procedure:","- 1. Clinic hours of operation will be set by the faculty supervisor.","- 2. Changes to the clinic hours of operation must be approved in advance by the faculty supervisor.","- 3. Staff and counselors will be available during their scheduled hours to perform the duties and responsibilities associated with their job.","- 4. No one should be in the clinic alone with a client."],
  ar:["لاحظي إنو كل سياسة مكتوبة بنفس الشكل: <b>Policy (السياسة) ← Purpose (الغرض) ← Procedure (الإجراء)</b> (السياسة، الهدف، الإجراء).","ساعات العمل: العيادة عندها مواعيد ثابتة عشان الناس يقدروا يوصلوا للخدمة. المشرف بيحدد المواعيد، وأي تغيير لازم يوافق عليه مقدماً، والموظفين لازم يكونوا موجودين في مواعيدهم، وما في زول يقعد براهو في العيادة مع عميل."]},
 {en:["Childcare for clients","Policy: No staff/counselor at Counseling Services is authorized to provide childcare for clients during counseling appointments.","Purpose: To ensure the safety of the clinic's clients and staff.","Procedure:","- 1. Staff/faculty members and counselors shall not provide childcare for clients in Counseling Service.","- 2. Clients should be informed of this in order that they have made independent arrangements for childcare before attending their session."],
  ar:["رعاية الأطفال: ما مسموح لأي موظف أو مرشد يمسك أطفال العملاء أثناء الجلسة. الهدف سلامة العملاء والموظفين.","الإجراء: العميل لازم يعرف ده من قبل، عشان يرتب لأطفاله قبل ما يجي الجلسة."]},
 {en:["Cell phone policy","Policy: Personal cell phone use.","Purpose: To assure that clients at Counseling Services do not use cell phones for personal phone calls or taking photographs.","Procedure:","- 1. Clients should be informed that the use of cell phones while in the facility for personal calls is prohibited.","- 2. Clients should be informed that the use of cell phones to take photographs of other clients is a breakdown of confidentiality and will not be tolerated."],
  ar:["سياسة الجوال: العملاء ما يستخدموا الجوال للمكالمات الشخصية أو التصوير جوة المركز.","تصوير العملاء التانيين يُعتبر <b>خرق للسرية</b> وما مسموح بيه أبداً."]},
 {en:["Management of aggressive or violent behavior","Policy: The clinic shall provide a safe environment for all clients, staff, and visitors. As a counselor-in-training, you are not obligated to be verbally or physically threatened.","Purpose: To provide for the management of persons who become aggressive or violent.","Procedure:","- 1. Staff shall not be alone in the building during any professional appointment.","- 2. If a client or visitor is known to be aggressive: notify other staff of the appointment time and office location, asking the staff to be available if necessary.","- If the person becomes aggressive, do not be a hero.","- Try to position oneself between the client and the door.","- If the situation escalates, escape or scream for help."],
  ar:["السلوك العدواني: العيادة لازم تكون آمنة للكل، وإنتي كمرشدة متدربة ما مجبورة تتعرضي لتهديد بالكلام أو بالفعل.","الإجراء: ما تكوني براك في المبنى أثناء أي موعد. ولو العميل معروف إنو عدواني، بلّغي زميلاتك بالموعد ومكان المكتب عشان يكونوا جاهزين.","لو بقى عدواني: ما تعملي بطلة، وخلّي نفسك بينه وبين الباب، ولو الوضع اتطور اطلعي أو اصرخي واطلبي المساعدة."]}
 ],
 defs:[
  {t:"Policy (in healthcare)", en:"A general plan of action used to guide desired outcomes and a fundamental guideline to help make decisions.", ar:"خطة عمل عامة بتوجّه النتائج المطلوبة ومرجع أساسي لاتخاذ القرار."},
  {t:"Policies", en:"Provide clear guidelines on how things should be done. They ensure that everyone understands the rules and expectations.", ar:"إرشادات واضحة عن كيف المفروض الحاجات تتعمل، عشان الكل يفهم القواعد."},
  {t:"Procedures", en:"Outline step-by-step processes for specific tasks. They promote consistency in how work is performed.", ar:"خطوات بالترتيب لمهام محددة، عشان الشغل يتعمل بنفس الطريقة."},
  {t:"Purpose of healthcare policy and procedures", en:"To communicate to employees the organization's desired outcomes.", ar:"توصيل النتائج المطلوبة من المؤسسة للموظفين."},
  {t:"Clinic Office Manager", en:"An administrative support position that does not include any counseling or supervision duties.", ar:"وظيفة دعم إداري ما فيها إرشاد ولا إشراف."}
 ],
 questions:[
  {q:"Step-by-step processes for specific tasks are called:", opts:["Policies","Procedures","Objectives","Ethics"], a:1},
  {q:"The Clinic Office Manager is allowed to:", opts:["Counsel clients on the phone","Assign clients to counselors","Schedule client appointments","Review session tapes"], a:2},
  {q:"Who sets the clinic hours of operation?", opts:["The Clinic Office Manager","The clients","The faculty supervisor","Student counselors"], a:2},
  {q:"Taking photographs of other clients is considered:", opts:["Allowed with a smile","A breakdown of confidentiality","A procedure","A purpose"], a:1},
  {q:"If a client becomes aggressive, you should:", opts:["Be a hero and calm them alone","Position yourself between the client and the door","Lock the door","Ignore it"], a:1},
  {q:"What is the difference between a policy and a procedure? Give an example from the lecture.", ans:"A policy gives the general rule (e.g. \"The clinic will have established hours of operation\"). A procedure gives the steps to apply it (e.g. the faculty supervisor sets the hours, changes are approved in advance, and no one is alone in the clinic with a client)."}
 ]},
{ title:"الأخلاقيات في الخدمات الصحية", en:"Ethics in Health Services", slides:[
 {en:["Ethics definition in healthcare","Health ethics promotes the consideration of values in the prioritization and justification of actions by health professionals, researchers, and policymakers that may impact the health and well-being of patients, families, and communities."],
  ar:["أخلاقيات الصحة بتخلي المختصين والباحثين وصناع السياسات ياخدوا القيم في الاعتبار، لما يرتبوا أولوياتهم ويبرروا قراراتهم البتأثر على صحة المرضى وأسرهم والمجتمع."]},
 {en:["Why are ethics important in counseling?","Ethics in counseling serve as the backbone of the profession, guiding counselors in making decisions that prioritize the well-being of their clients.","Building trust is essential in the counselor-client relationship, and adherence to ethical guidelines is key to establishing and maintaining this trust.","Clients must feel confident that their counselor will act in their best interests, respect their confidentiality and provide a safe space for them to express their thoughts and feelings."],
  ar:["الأخلاقيات هي <b>العمود الفقري</b> لمهنة الإرشاد، بتوجّه المرشد يتخذ قرارات بتقدّم مصلحة العميل.","الثقة أساس العلاقة بين المرشد والعميل، والالتزام بالأخلاقيات هو البيبني الثقة دي ويحافظ عليها. العميل لازم يحس إنو المرشد بيشتغل لمصلحته، وبيحترم سريته، وبيوفر ليه مساحة آمنة يعبّر فيها."]},
 {en:["Why do we need ethics?","Psychologists provide direct services to clients and patients in a variety of settings such as primary care and rehabilitation centers.","General Principles:"],
  ar:["بنحتاج الأخلاقيات لأن الأخصائيين النفسيين بيقدموا خدمات مباشرة للعملاء في أماكن كتيرة، زي الرعاية الأولية ومراكز التأهيل.","السلايدات الجاية فيها <b>المبادئ العامة</b>."]},
 {en:["Respect for people's rights and dignity","Psychologists respect the dignity and worth of all people, and the rights of individuals to privacy, confidentiality, and self-determination.","- Aware that special safeguards may be necessary for those with impaired autonomous decision-making abilities.","- Aware of and respect cultural, individual, and role differences (e.g., sex, race, sexual orientation) and consider these factors when working with such groups.","- Try to eliminate biases based on these factors and do not condone biases of others."],
  ar:["احترام حقوق الناس وكرامتهم: الأخصائي بيحترم كرامة كل الناس، وحقهم في الخصوصية والسرية وتقرير مصيرهم.","• في ناس قدرتهم على القرار المستقل ضعيفة، وديل محتاجين حماية إضافية.","• يحترم الفروق الثقافية والفردية ويراعيها.","• يحاول يتخلص من تحيزاته، وما يقبل تحيز الآخرين."]},
 {en:["Beneficence and nonmaleficence","Psychologists strive to benefit those with whom they work and take care to do no harm.","- Safeguard rights of people and lab animals.","- Resolve conflicts to minimize harm.","- Be aware of how own physical and mental health affects ability to help others."],
  ar:["فعل الخير وعدم الإيذاء: الأخصائي بيحاول ينفع الناس البيشتغل معاهم، وبيحرص ما يضرهم.","يحمي حقوق الناس وحيوانات التجارب، ويحل التعارضات بأقل ضرر، ويكون واعي إنو صحته الجسدية والنفسية بتأثر على قدرته يساعد غيره."]},
 {en:["Fidelity and responsibility","Psychologists establish relationships of trust with those with whom they work.","- Aware of responsibilities to society and community.","- Clarify professional roles, accept responsibility for their behavior.","- Cooperate with other professionals and institutions to serve client.","- Concerned about ethical compliance of colleagues.","- Contribute portion of their time to pro bono work."],
  ar:["الأمانة والمسؤولية: الأخصائي بيبني علاقات ثقة مع الناس البيشتغل معاهم.","واعي بمسؤوليته تجاه المجتمع، بيوضح دوره المهني ويتحمل مسؤولية تصرفاته، بيتعاون مع المختصين والمؤسسات التانية لمصلحة العميل، بيهتم إنو زملاؤه ملتزمين أخلاقياً، وبيدي جزء من وقته لشغل تطوعي مجاني."]},
 {en:["Integrity","Psychologists seek to promote accuracy, honesty, and truthfulness in the science, teaching, and practice of psychology.","- Don't lie, cheat, steal, misrepresent facts.","- Keep promises and avoid unclear or unwise commitments.","- If deception is ethically justifiable, obligated to correct resulting mistrust or harmful effects."],
  ar:["النزاهة: الدقة والصدق في العلم والتدريس والممارسة.","ما يكذب ولا يغش ولا يسرق ولا يحرّف الحقائق، يلتزم بوعوده وما يدي وعود مش واضحة. ولو اضطر يخفي حاجة لسبب أخلاقي مبرر، لازم بعدها يصلح أي ضرر أو فقدان ثقة حصل."]},
 {en:["Justice","Psychologists recognize that fairness and justice entitle all persons to access to and benefit from the contributions of psychology and to equal quality in the services provided by psychologists.","- Ensure that biases, boundaries of competence, and limitations of expertise do not lead to or condone unjust practices."],
  ar:["العدالة: كل الناس من حقهم يستفيدوا من علم النفس، ويلقوا خدمات بنفس الجودة.","الأخصائي بيتأكد إنو تحيزاته أو حدود خبرته ما تخليه يظلم زول."]},
 {en:["Competence","The Competence standard emphasizes that psychologists should only provide services within the limits of their education, training, and experience.","They should recognize their professional limitations and refer clients to qualified specialists when necessary. However, in emergency situations, psychologists may provide help even if the situation is outside their usual area of expertise.","Maintain and improve their skills through continuing education, make ethical professional judgments, delegate tasks responsibly, and address personal problems or conflicts that could affect their professional performance."],
  ar:["الكفاءة: الأخصائي يقدم خدمات في حدود تعليمه وتدريبه وخبرته بس.","يعرف حدوده، ويحوّل العميل لمختص لو احتاج. <b>الاستثناء</b>: في حالات الطوارئ ممكن يساعد حتى لو الحالة برا تخصصه.","ويطوّر مهاراته بالتعليم المستمر، ويفوّض المهام بمسؤولية، ويعالج مشاكله الشخصية البتأثر على شغله."]},
 {en:["Ethical principles for data collection (M&E)","All staff, including data collectors, must adhere to these ethical principles for any M&E-related activities:","1. Do No Harm: Safeguard against collecting data in a way that might cause harm to participants. If participants have an adverse reaction, discontinue data collection and revisit how to collect data safely.","2. Privacy: Remove identifying information from records. Ask participants for permission before making public any information that might reveal who they are. Conduct any interviews in a safe and private location."],
  ar:["مبادئ أخلاقية لجمع البيانات في المتابعة والتقييم، وكل الموظفين ملزمين بيها:","1. <b>عدم الإضرار</b>: ما تجمعي البيانات بطريقة تضر المشاركين. لو حصل ليهم رد فعل سلبي، وقفي وراجعي الطريقة.","2. <b>الخصوصية</b>: شيلي أي معلومة بتكشف هوية المشارك من السجلات، واستأذنيه قبل نشر أي حاجة بتعرّف بيه، واعملي المقابلات في مكان آمن وخاص."]},
 {en:["Ethical principles for data collection (continued)","3. Confidentiality: Participant confidentiality must be guaranteed during an evaluation. Reassure participants that case information is kept private and confidential.","4. Informed Consent: Participants should be fully informed about the nature of data collection and give their consent to participate. Participants should be aware of the purpose of M&E, how findings will be used, and if there are any potential risks. Informed consent must also be given for use of any photos or videos of participants."],
  ar:["3. <b>السرية</b>: لازم نضمن سرية المشاركين، ونطمنهم إنو معلوماتهم محفوظة.","4. <b>الموافقة المستنيرة</b>: المشارك يعرف كل حاجة عن جمع البيانات، وهدفه، وكيف النتائج حتُستخدم، وأي مخاطر محتملة، وبعدها يوافق. وكمان لازم موافقة على أي صور أو فيديو."]},
 {en:["Ethical principles for data collection (continued)","5. Voluntary Participation: Individuals have the right to refuse to participate in any M&E data collection without any negative consequences and without being asked for an explanation.","6. Act Professionally: Be friendly, polite, non-judgmental, and respectful when collecting M&E data from clients.","7. Right to Service: All participants in an evaluation have the right to receive mental health services."],
  ar:["5. <b>المشاركة الطوعية</b>: من حق أي زول يرفض المشاركة بدون أي عواقب، وبدون ما يُسأل عن السبب.","6. <b>التصرف المهني</b>: كوني لطيفة ومؤدبة ومحترمة، وما تحكمي على الناس.","7. <b>الحق في الخدمة</b>: كل المشاركين من حقهم يتلقوا خدمات الصحة النفسية.","المبادئ السبعة: Do No Harm, Privacy, Confidentiality, Informed Consent, Voluntary Participation, Act Professionally, Right to Service."]},
 {en:["Third-party requests for services","If you are asked to perform therapy, assessment, or some other psychological service by a third party (e.g. parent, teacher, human resources office, commanding officer) make sure that each party understands:","- Your role","- How the services/information is to be used","- Limitations to confidentiality or privacy","Also, be sure to KEEP GOOD RECORDS!"],
  ar:["لو طرف ثالث طلب منك خدمة لزول تاني، مثلاً أب أو معلم أو جهة عمل أو قائد عسكري، اتأكدي إنو كل الأطراف فاهمين: دورك، وكيف المعلومات حتُستخدم، وحدود السرية والخصوصية.","وما تنسي: <b>احتفظي بسجلات كويسة!</b>"]},
 {en:["Delegation to and supervision of subordinates","Whenever you delegate professional responsibilities to others or supervise their professional activities, make sure that they are competent according to their education, training, or experience."],
  ar:["التفويض والإشراف: لما تفوضي مهام مهنية لزول أو تشرفي على شغله، اتأكدي إنو كفء حسب تعليمه أو تدريبه أو خبرته."]}
 ],

  {t:"Competence", en:"Psychologists should only provide services within the limits of their education, training, and experience.", ar:"تقديم الخدمات في حدود التعليم والتدريب والخبرة بس."},

  return htmlText.split(/(<[^>]+>)/).map(part => part.startsWith("<") ? part : part.replace(TERM_RE, w => {
    const i = lookup(w); if (i < 0 || seen.has(i)) return w; seen.add(i);
    return `<button type="button" class="term" data-t="${i}">${w}</button>`;
  })).join("");
}

function alertsHTML(){

  const items = ALERTS.map(a => ({...a, left: Math.round((new Date(a.date+"T00:00:00") - today)/864e5)})).filter(a => a.left >= 0).sort((x,y)=>x.left-y.left);

  return `<div class="alerts">` + items.map(a => {

    const d = new Date(a.date+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});

}

const fmt12 = t => { let [h,m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
function nextSlots(){
  const now = sudanNow(), W = 7*1440, nowAbs = now.dow*1440 + now.min;
  return SCHEDULE.map(s => {
    const st = s.day*1440 + toMin(s.start), en = s.day*1440 + toMin(s.end);
    const live = nowAbs >= st && nowAbs < en;
    return {...s, live, wait: live ? 0 : ((st - nowAbs) % W + W) % W, today: s.day === now.dow};
  }).sort((a,b) => a.wait - b.wait);
}
const waitText = m => { const d = Math.floor(m/1440), h = Math.floor(m%1440/60), mi = m%60; return d ? `in ${d} day${d>1?"s":""}${h?` ${h} h`:""}` : h ? `in ${h} h${mi?` ${mi} min`:""}` : `in ${mi} min`; };

  const rows = SCHEDULE.slice().sort((a,b) => a.day - b.day || toMin(a.start) - toMin(b.start)).map(s => {
    const x = slots.find(y => y.course === s.course && y.day === s.day);
    return `<div class="slot ${x.live ? "live" : x.today ? "today" : ""}"><span class="sd">${DAYS[s.day].slice(0,3)}</span><span class="sc">${esc(s.course)}</span><span class="st">${fmt12(s.start)} – ${fmt12(s.end)}</span></div>`;
  }).join("");

function streak(){
  /* one missed day per week (Sun-Sat) is a rest day and does not break the streak */
  const set = new Set(studyDays()), iso = d => d.toISOString().slice(0,10), rest = new Set();
  let n = 0; const t = new Date(sudanNow().date + "T12:00:00Z");
  if (!set.has(iso(t))) t.setUTCDate(t.getUTCDate()-1);
  for (let guard = 0; guard < 800; guard++){
    const d = iso(t);
    if (set.has(d)){ n++; t.setUTCDate(t.getUTCDate()-1); continue; }
    const prev = new Date(t); prev.setUTCDate(prev.getUTCDate()-1); const wk = weekStart(d);
    if (n > 0 && !rest.has(wk) && set.has(iso(prev))){ rest.add(wk); t.setUTCDate(t.getUTCDate()-1); continue; }
    break;
  }
  if (n >= 7) flag("auw-s7");
  return n;
}

}

/* live leaderboard from the published sheet */
function parseCSV(t){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (q){ if (ch === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && t[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function rowDate(ts){
  const a = String(ts).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  let m = a.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m = a.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return null;
}
function rankWeek(recs, wk){
  const by = new Map();
  recs.filter(r => weekStart(r.d) === wk).forEach(r => by.set(r.key, r));
  return [...by.values()].sort((a,b) => b.points - a.points || a.i - b.i);
}
async function loadLiveBoard(){
  if (!LB_CSV) return;
  try {
    const res = await fetch(LB_CSV, {cache:"no-store"}); if (!res.ok) return;
    const rows = parseCSV(await res.text()); if (rows.length < 1) return;
    const h = rows[0].map(x => x.trim().toLowerCase());
    const ci = n => h.findIndex(x => x.startsWith(n));
    const iN = ci("name"), iP = ci("points"), iS = ci("streak");
    if (iN < 0 || iP < 0) return;
    const recs = [];
    rows.slice(1).forEach((r, i) => {
      const name = (r[iN]||"").trim().replace(/[<>]/g,""), pts = Number(r[iP]), d = rowDate(r[0]);
      if (!name || !d || !Number.isInteger(pts) || pts < 0 || pts > 400) return;
      recs.push({key:name.toLowerCase(), name, points:pts, streak:parseInt(r[iS])||0, d, i});
    });
    const wk = weekStart(sudanNow().date), cur = rankWeek(recs, wk), prev = rankWeek(recs, lastWeekStart());
    const now = new Date();
    LEADERBOARD.rows = cur.map(r => ({name:r.name, points:r.points, streak:r.streak}));
    LEADERBOARD.batchTotal = cur.reduce((t,r) => t + r.points, 0);
    LEADERBOARD.lastWeekTop = prev.slice(0,3).map(r => r.name);
    LEADERBOARD.updated = "live, " + now.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
    if (!location.hash || location.hash === "#") route();
  } catch(e){}
}

/* routing */
function route(){
  const h = location.hash.replace("#","");
  const c = COURSES.find(x => h === x.id || h.startsWith(x.id + "-"));
  let view, crumbs = `<a href="#">Home</a>`;
  if (h === "how"){ view = howView(); crumbs += ` <span>›</span> How it works`; }
  else if (!c) view = homeView();
  else {
    const rest = h.slice(c.id.length), m = rest.match(/^-lec-(\d+)$/);
    crumbs += ` <span>›</span> <a href="#${c.id}">${esc(c.name)}</a>`;
    if (m && c.lectures[+m[1]-1]){ view = lectureView(c, +m[1]); crumbs += ` <span>›</span> Lecture ${m[1]}`; }
    else if (rest === "-defs") view = defsView(c);
    else if (rest === "-cards") view = cardsView(c);
    else if (rest === "-terms") view = termsView(c);
    else if (rest === "-quiz") view = quizView(c);
    else if (rest === "-exam") view = examView(c);
    else if (rest === "-review") view = reviewView(c);
    else if (rest === "-miss") view = missView(c);
    else view = lecturesView(c);
    if (m){ setTimeout(() => wireProgress(c, +m[1])); try { localStorage.setItem("auw-last", JSON.stringify({c:c.id, n:+m[1]})); } catch(e){} }
  }
  $("crumbs").innerHTML = crumbs;
  $("main").innerHTML = view;
  if (c && h.endsWith("-cards")) wireCards(c);
  if (/-lec-\d+$/.test(h)) logStudy();
  const ds = $("d-search");
  if (ds) ds.oninput = () => {
    const v = ds.value.trim().toLowerCase(); let shown = 0;
    document.querySelectorAll(".group").forEach(g => { let k = 0; g.querySelectorAll(".def").forEach(d => { const ok = !v || d.dataset.s.includes(v); d.hidden = !ok; if (ok) k++; }); g.hidden = !k; shown += k; });
    $("d-none").hidden = shown > 0; $("d-count").textContent = v ? `${shown} result${shown===1?"":"s"}` : "";
  };
  const s = $("q-search");
  if (s) s.oninput = () => { const v = s.value.trim().toLowerCase(); document.querySelectorAll(".gi").forEach(g => g.hidden = !!v && !g.dataset.s.includes(v)); };
  closeSheet();
}
function wireProgress(c, n){
  const k = pkey(c,n);
  document.querySelectorAll(".btn[data-k]").forEach(b => b.onclick = () => {
    progress[k] = {...(progress[k]||{}), [b.dataset.k]: !(progress[k]||{})[b.dataset.k]}; store.set(progress);
    const on = progress[k][b.dataset.k]; b.classList.toggle("on", on);
    if (on && b.dataset.k === "read" && addEvent("r:" + k, 5)) toast("+5 نقاط 🌟");
    b.textContent = b.dataset.k === "read" ? (on ? "✓ Read" : "Mark as read") : (on ? "✓ Reviewed" : "Mark as reviewed");
  });
}

/* interactions */
function showFb(k, ok){
  const f = $("fb-"+k); if (!f) return;
  f.hidden = false; f.className = "fbk " + (ok ? "ok" : "no");
  f.innerHTML = ok ? `<b>${esc(pick(MSG_CORRECT))}</b>${QEX[k] ? `<p>${esc(QEX[k])}</p>` : ""}`
                   : `<b>${esc(pick(MSG_WRONG))}</b><span>${esc(pick(MSG_TRY))}</span><button type="button" class="reveal" data-showans="${k}">اعرضي الإجابة والشرح</button>`;
}
function speak(w){
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w.replace(/\(.*?\)/g,"")); u.lang = "en-US"; u.rate = 0.85; speechSynthesis.speak(u); } catch(e){}
}
function openSheet(i){
  const t = TERMS[i];
  $("sh-w").textContent = t.w; $("sh-m").textContent = t.ar; $("sh-n").textContent = t.n;
  $("sh-say").hidden = !canSpeak; $("sh-say").onclick = () => speak(t.w);
  $("sheet").hidden = false; $("sh-x").focus();
}
function closeSheet(){ $("sheet").hidden = true; }
$("sh-x").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("click", e => {
  if (examClick(e)) return;
  if (cardClick(e)) return;
  if (lbClick(e)) return;
  const t = e.target.closest(".term, .gi"); if (t){ openSheet(+t.dataset.t); if (t.classList.contains("gi")) speak(TERMS[+t.dataset.t].w); return; }
  const sb = e.target.closest("[data-say]"); if (sb){ speak(sb.dataset.say); return; }
  const o = e.target.closest(".opt"); if (o){
    const g = document.querySelectorAll(`.opt[data-q="${o.dataset.q}"]`); g.forEach(x => x.classList.remove("right","wrong"));
    if ([...g].some(x => x.dataset.done)) return; if (o.dataset.j === o.dataset.a) g.forEach(x => x.dataset.done = "1");
    const ok = o.dataset.j === o.dataset.a;
    if (ok){ o.classList.add("right"); showFb(o.dataset.q, true); } else { o.classList.add("wrong"); showFb(o.dataset.q, false); }
    logStudy();
    if (o.dataset.qid){
      const ft = firstTries(); if (!(o.dataset.qid in ft)){ ft[o.dataset.qid] = ok; try { localStorage.setItem("auw-first", JSON.stringify(ft)); } catch(err){} }
      if (addEvent("q:" + o.dataset.qid, ok ? 1 : 0) && ok) toast("+1 نقطة");
      const mm = missGet(); if (ok){ if (mm[o.dataset.qid]){ delete mm[o.dataset.qid]; missSet(mm); if (o.closest(".mi")) toast("أحسنتِ! السؤال اتشال من أخطائك ✅"); } } else if (!mm[o.dataset.qid]){ mm[o.dataset.qid] = 1; missSet(mm); }
    } else if (o.dataset.qotd){
      if (addEvent("d:" + sudanNow().date, ok ? 5 : 0)){ if (ok){ bump("auw-qotd-n"); toast("+5 نقاط 🌟"); } }
    }
    return; }
  const sa = e.target.closest("[data-showans]"); if (sa){ const k = sa.dataset.showans; const g = document.querySelectorAll(`.opt[data-q="${k}"]`); g.forEach(x => { x.dataset.done = "1"; if (x.dataset.j === x.dataset.a) x.classList.add("right"); }); const f = $("fb-"+k); f.innerHTML = QEX[k] ? `<p>${esc(QEX[k])}</p>` : `<p>الإجابة الصاح ملوّنة بالأخضر.</p>`; return; }
  const r = e.target.closest(".reveal"); if (r){ const a = $("ans-"+r.dataset.r); a.hidden = !a.hidden; r.textContent = a.hidden ? "Show answer" : "Hide answer"; return; }
  if (!e.target.closest(".sheet")) closeSheet();
});
window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); });
route();
loadLiveBoard();
</script>
